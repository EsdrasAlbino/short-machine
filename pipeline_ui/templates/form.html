<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Pipeline TikTok → Postiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Rodar pipeline</h1>

  {% if active_run_id %}
  <p class="notice">
    Já existe uma execução em andamento.
    <a href="/run/{{ active_run_id }}">Ver log ao vivo</a>
  </p>
  {% endif %}

  <form id="pipeline-form">
    <label>
      Preset
      <select id="preset-select">
        <option value="">-- Novo preset --</option>
        {% for p in presets %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
    </label>

    <fieldset>
      <legend>Config</legend>

      <label>Nome do preset <input type="text" name="run_name" id="run_name" required></label>

      <h3>Download</h3>
      <label>Perfil TikTok (URL) <input type="text" name="profile_url" id="profile_url" placeholder="https://www.tiktok.com/@conta" required></label>
      <label>Quantidade de vídeos <input type="number" name="video_count" id="video_count" min="1" required></label>

      <h3>Edição</h3>
      <label>Logo (caminho do arquivo) <input type="text" name="logo_path" id="logo_path"></label>
      <label>Ícone (caminho do arquivo) <input type="text" name="icon_path" id="icon_path"></label>
      <label>Região da marca d'água de origem (x0,y0,x1,y1, frações 0-1) <input type="text" name="watermark_region" id="watermark_region" placeholder="0.35,0.935,0.68,0.99"></label>
      <label class="checkbox"><input type="checkbox" name="captions_enabled" id="captions_enabled"> Legendas automáticas</label>
      <label class="checkbox"><input type="checkbox" name="background_blur" id="background_blur" checked> Fundo desfocado (mesmo estilo dos vídeos de futebol)</label>

      <h3>Agendamento</h3>
      <label>ID da integração (canal Postiz) <input type="text" name="integration_id" id="integration_id" required></label>
      <label>Posts por dia <input type="number" name="posts_per_day" id="posts_per_day" min="1" required></label>
      <label>Horários UTC (separados por vírgula) <input type="text" name="times_utc" id="times_utc" placeholder="15:00,20:00" required></label>

      <h3>Execução</h3>
      <label>Data de início <input type="date" name="start_date" id="start_date" required></label>
      <label class="checkbox"><input type="checkbox" name="dry_run" id="dry_run"> Dry-run (não publica de verdade)</label>
    </fieldset>

    <div id="error" class="error"></div>

    <button type="button" id="save-btn">Salvar preset</button>
    <button type="button" id="run-btn" {% if active_run_id %}disabled{% endif %}>Rodar</button>
  </form>

  <script src="/static/form.js"></script>
</body>
</html>
