services:
  pipeline-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
    expose:
      # No host "ports:" publish -- Coolify's own Traefik proxy runs on the
      # host's port 8000, so binding the container there too collided with
      # Coolify itself. Traefik routes the configured domain to this
      # container over Coolify's internal Docker network instead.
      - "8000"
    volumes:
      # Named volumes (not relative bind mounts) -- Coolify re-clones the git
      # repo into a fresh directory on each deploy, so a bind mount like
      # "./raw:/app/raw" would get wiped exactly like Postiz's /uploads was
      # in a past incident. Named volumes live outside the checkout and
      # survive redeploys.
      - pipeline_raw:/app/raw
      - pipeline_edited:/app/edited
      - pipeline_configs:/app/pipeline_ui/backend/configs
      - pipeline_runs:/app/pipeline_ui/backend/runs
      - pipeline_previews:/app/pipeline_ui/backend/previews

volumes:
  pipeline_raw:
  pipeline_edited:
  pipeline_configs:
  pipeline_runs:
  pipeline_previews:
